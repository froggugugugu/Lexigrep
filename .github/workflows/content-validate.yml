name: content-validate
on:
  pull_request:
    paths: ["content/**"]
  push:
    branches: [main]
    paths: ["content/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node content/validate.mjs
